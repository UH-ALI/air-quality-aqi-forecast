name: Inference Pipeline

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:  # Allow manual trigger

jobs:
  inference-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        # working-directory: air-quality-aqi-forecast
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Inference Pipeline
        # working-directory: air-quality-aqi-forecast
        env:
          HOPSWORKS_API_KEY: ${{ vars.HOPSWORKS_API_KEY || secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST || secrets.HOPSWORKS_HOST }}
          HOPSWORKS_PROJECT: ${{ vars.HOPSWORKS_PROJECT || secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_PORT: ${{ vars.HOPSWORKS_PORT || secrets.HOPSWORKS_PORT }}
        run: |
          python inference_pipeline.py

      - name: Upload Forecast Results
        uses: actions/upload-artifact@v4
        with:
          name: aqi-forecast-${{ github.run_number }}
          path: forecast_72h.csv
          retention-days: 30
