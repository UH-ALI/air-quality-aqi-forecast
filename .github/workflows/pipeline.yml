name: Air Quality ML Pipeline

on:
  schedule:
    # Feature pipeline: every hour
    - cron: "0 * * * *"
    # Training pipeline: every Sunday at midnight UTC
    - cron: "0 0 * * 0"
    # Inference pipeline: every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main

jobs:
  feature-pipeline:
    runs-on: ubuntu-latest
    # Run if: hourly cron, manual trigger, or push to main
    if: |
      github.event.schedule == '0 * * * *' || 
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Feature Pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          python feature_pipeline.py

  training-pipeline:
    runs-on: ubuntu-latest
    # Run only on weekly schedule or manual trigger
    if: |
      github.event.schedule == '0 0 * * 0' || 
      github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Training Pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          python training_pipeline.py

  inference-pipeline:
    runs-on: ubuntu-latest
    # Run every 6 hours or manual trigger
    if: |
      github.event.schedule == '0 */6 * * *' || 
      github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Inference Pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          python inference_pipeline.py

      - name: Upload Forecast Results
        uses: actions/upload-artifact@v4
        with:
          name: aqi-forecast-${{ github.run_number }}
          path: forecast_72h.csv
          retention-days: 30
