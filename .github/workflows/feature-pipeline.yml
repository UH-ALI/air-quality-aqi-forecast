name: Feature Pipeline

on:
  schedule:
    - cron: "0 * * * *"  # Every hour
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main

jobs:
  feature-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        # working-directory: air-quality-aqi-forecast
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Feature Pipeline
        # working-directory: air-quality-aqi-forecast
        env:
          HOPSWORKS_API_KEY: ${{ vars.HOPSWORKS_API_KEY || secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST || secrets.HOPSWORKS_HOST }}
          HOPSWORKS_PROJECT: ${{ vars.HOPSWORKS_PROJECT || secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_PORT: ${{ vars.HOPSWORKS_PORT || secrets.HOPSWORKS_PORT }}
          OPENWEATHER_API_KEY: ${{ vars.OPENWEATHER_API_KEY || secrets.OPENWEATHER_API_KEY }}
          POLLUTION_HISTORY_SOURCE: openweather
        run: |
          python feature_pipeline.py
