name: Training Pipeline

on:
  schedule:
    - cron: "0 0 * * 0"  # Every Sunday at midnight UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  training-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        # working-directory: air-quality-aqi-forecast
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Training Pipeline
        env:
                HOPSWORKS_API_KEY: ${{ vars.HOPSWORKS_API_KEY || secrets.HOPSWORKS_API_KEY }}
                HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST || secrets.HOPSWORKS_HOST }}
                HOPSWORKS_PROJECT: ${{ vars.HOPSWORKS_PROJECT || secrets.HOPSWORKS_PROJECT }}
        run: |
                python training_pipeline.py
